services:
  wordpress:
    image: wordpress
    env_file:
      - path: wordpress.env
        required: true
  mariadb:
    image: mariadb:latest
    env_file:
    - path: mariadb.env
      required: true
  
  adminer:
    image: adminer
    expose:
      - 127.0.0.1:8080:8080 # do not expose adminer on Internet. Vulnerabilities arise quickly.